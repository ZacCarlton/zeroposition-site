<svg width="760" height="400" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A site-photo tool's percent-complete reading matches a manual count on a single-story warehouse it was tested on. A multi-story building was never in the test."><style>text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif}.m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;letter-spacing:1.3px}</style><rect width="760" height="400" fill="#FFFFFF"/>
  <g class="m" font-size="11" letter-spacing="1.3" fill="#1B3B6F">
    <text x="40" y="34">WHAT THE VENDOR TESTED</text>
    <text x="440" y="34">WHAT THE CLAIM COVERS TOO</text>
  </g>
  <!-- camera frame corners -->
  <g fill="none" stroke="#1B3B6F" stroke-width="2.4" stroke-linecap="square">
    <path d="M44 70 v-16 h16"/><path d="M356 70 v-16 h-16"/><path d="M44 262 v16 h16"/><path d="M356 262 v16 h-16"/>
  </g>
  <!-- warehouse: steel frame, half clad -->
  <g stroke="#12161C" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <line x1="62" y1="246" x2="340" y2="246"/>
    <path d="M70 246 V140 L200 112 L330 140 V246"/>
  </g>
  <g stroke="#12161C" stroke-width="1.5">
    <line x1="113" y1="131" x2="113" y2="246"/><line x1="157" y1="121" x2="157" y2="246"/><line x1="200" y1="112" x2="200" y2="246"/>
    <line x1="243" y1="121" x2="243" y2="246"/><line x1="287" y1="131" x2="287" y2="246"/>
  </g>
  <!-- cladding on the left half -->
  <path d="M70 246 V140 L200 112 V246 Z" fill="#E3E8EE" stroke="#12161C" stroke-width="1.5"/>
  <g stroke="#8D98A6" stroke-width="1"><line x1="84" y1="140" x2="84" y2="246"/><line x1="98" y1="137" x2="98" y2="246"/><line x1="128" y1="130" x2="128" y2="246"/><line x1="142" y1="127" x2="142" y2="246"/><line x1="172" y1="118" x2="172" y2="246"/><line x1="186" y1="115" x2="186" y2="246"/></g>
  <line x1="113" y1="131" x2="113" y2="246" stroke="#12161C" stroke-width="1.5"/><line x1="157" y1="121" x2="157" y2="246" stroke="#12161C" stroke-width="1.5"/>
  <!-- AI reading -->
  <rect x="226" y="62" width="122" height="24" fill="#1B3B6F"/>
  <text x="287" y="78" text-anchor="middle" class="m" font-size="11" letter-spacing="1" fill="#FFFFFF">TOOL: 48% DONE</text>
  <!-- manual count clipboard -->
  <g stroke="#12161C" stroke-width="1.5" fill="#FFFFFF">
    <rect x="44" y="300" width="96" height="70" rx="2"/>
    <rect x="76" y="294" width="32" height="10" rx="2" fill="#F2F4F7"/>
  </g>
  <g stroke="#8D98A6" stroke-width="1.5" stroke-linecap="round"><line x1="56" y1="320" x2="106" y2="320"/><line x1="56" y1="334" x2="98" y2="334"/></g>
  <text x="56" y="358" class="m" font-size="11" fill="#12161C">COUNT 47%</text>
  <path d="M166 330 l7 7 l14 -16" fill="none" stroke="#157F3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="330" font-size="14" fill="#12161C">Within 2% of the</text>
  <text x="198" y="348" font-size="14" fill="#12161C">manual count</text>

  <!-- right: multi-story, outside the test -->
  <g fill="none" stroke="#8D98A6" stroke-width="2.4" stroke-linecap="square" stroke-dasharray="1 0">
    <path d="M444 70 v-16 h16"/><path d="M716 70 v-16 h-16"/><path d="M444 262 v16 h16"/><path d="M716 262 v16 h-16"/>
  </g>
  <g stroke="#8D98A6" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <rect x="500" y="80" width="160" height="166"/>
    <line x1="500" y1="121" x2="660" y2="121"/><line x1="500" y1="163" x2="660" y2="163"/><line x1="500" y1="204" x2="660" y2="204"/>
    <line x1="553" y1="80" x2="553" y2="246"/><line x1="607" y1="80" x2="607" y2="246"/>
  </g>
  <line x1="470" y1="246" x2="690" y2="246" stroke="#8D98A6" stroke-width="1.5"/>
  <circle cx="580" cy="163" r="24" fill="#FFFFFF" stroke="#56606C" stroke-width="1.5"/>
  <text x="580" y="172" text-anchor="middle" font-size="26" font-weight="600" fill="#56606C">?</text>
  <text x="444" y="330" font-size="14" fill="#12161C">Multi-story and occupied work</text>
  <text x="444" y="348" font-size="14" fill="#12161C">were never in the vendor's test</text>
</svg>
