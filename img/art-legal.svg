<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="The vendor's checker matched case names only, not the court, year or reporter."><style>text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif}.m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;letter-spacing:1.3px}</style><rect width="760" height="340" fill="#FFFFFF"/><text x="36" y="34" font-size="11" fill="#1B3B6F" class="m">WHAT THE CHECKER MATCHED</text><text x="406" y="34" font-size="11" fill="#1B3B6F" class="m">WHAT IT NEVER COMPARED</text><rect x="70" y="70" width="260" height="170" fill="#FFFFFF" stroke="#12161C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="106" font-size="11" fill="#56606C" class="m">CASE</text><text x="180" y="106" font-size="14" fill="#157F3B">Smith v. Jones</text><text x="86" y="142" font-size="11" fill="#56606C" class="m">COURT</text><text x="180" y="142" font-size="14" fill="#12161C">...</text><text x="86" y="178" font-size="11" fill="#56606C" class="m">YEAR</text><text x="180" y="178" font-size="14" fill="#12161C">...</text><text x="86" y="214" font-size="11" fill="#56606C" class="m">REPORTER</text><text x="180" y="214" font-size="14" fill="#12161C">...</text><rect x="440" y="70" width="260" height="170" fill="#FFFFFF" stroke="#12161C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="106" font-size="11" fill="#56606C" class="m">CASE</text><text x="550" y="106" font-size="14" fill="#12161C">Smith v. Jones</text><text x="456" y="142" font-size="11" fill="#56606C" class="m">COURT</text><text x="550" y="142" font-size="14" fill="#B42318">...</text><rect x="544" y="124" width="140" height="26" fill="none" stroke="#B42318" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="178" font-size="11" fill="#56606C" class="m">YEAR</text><text x="550" y="178" font-size="14" fill="#B42318">...</text><rect x="544" y="160" width="140" height="26" fill="none" stroke="#B42318" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="214" font-size="11" fill="#56606C" class="m">REPORTER</text><text x="550" y="214" font-size="14" fill="#B42318">...</text><rect x="544" y="196" width="140" height="26" fill="none" stroke="#B42318" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 294 l7 7 l14 -16" fill="none" stroke="#157F3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="300" font-size="14" fill="#12161C">A case with a similar name</text><path d="M410 287 l14 14 M424 287 l-14 14" fill="none" stroke="#B42318" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="300" font-size="14" fill="#12161C">Court, year and reporter,</text><text x="440" y="318" font-size="14" fill="#12161C">so fake citations passed</text><line x1="388" y1="52" x2="388" y2="320" fill="none" stroke="#D3D9E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
