<svg width="760" height="400" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two chest X-rays. With a chest tube in the image, the AI flags the collapsed lung. Before treatment, with no tube, it misses it."><style>text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif}.m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;letter-spacing:1.3px}</style><rect width="760" height="400" fill="#FFFFFF"/>
  <g class="m" font-size="11" letter-spacing="1.3" fill="#1B3B6F">
    <text x="40" y="34">WITH A CHEST TUBE</text>
    <text x="420" y="34">BEFORE TREATMENT, NO TUBE</text>
  </g>
  <!-- panel A -->
  <rect x="40" y="48" width="300" height="270" rx="4" fill="#0E1F3B"/>
  <g fill="none" stroke="#D3D9E0" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="190" y1="62" x2="190" y2="306" stroke="#8D98A6" stroke-width="5" opacity="0.6"/>
    <path d="M180 84 C 120 84, 82 120, 78 200 C 76 250, 96 290, 150 292 C 172 292, 178 270, 178 240 L 178 100"/>
    <path d="M200 84 C 260 84, 298 120, 302 200 C 304 250, 284 290, 230 292 C 208 292, 202 270, 202 240 L 202 100"/>
  </g>
  <g fill="none" stroke="#8D98A6" stroke-width="1" opacity="0.7">
    <path d="M178 110 C 140 104, 108 116, 92 136"/><path d="M178 140 C 138 134, 104 146, 86 168"/><path d="M178 170 C 136 164, 100 176, 82 200"/><path d="M178 200 C 136 194, 100 206, 82 232"/>
    <path d="M202 110 C 240 104, 272 116, 288 136"/><path d="M202 140 C 242 134, 276 146, 294 168"/><path d="M202 170 C 244 164, 280 176, 298 200"/><path d="M202 200 C 244 194, 280 206, 298 232"/>
  </g>
  <!-- collapsed lung edge, right side of image -->
  <path d="M214 98 C 250 104, 268 150, 266 210 C 264 250, 250 276, 226 280" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.8"/>
  <!-- chest tube -->
  <path d="M340 238 C 310 236, 292 226, 282 204 C 274 186, 272 160, 276 136" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 238 C 310 236, 292 226, 282 204 C 274 186, 272 160, 276 136" fill="none" stroke="#0E1F3B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- AI flag on the tube -->
  <rect x="252" y="118" width="62" height="110" fill="none" stroke="#FF5A4E" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="252" y="96" width="62" height="20" fill="#FF5A4E"/>
  <text x="283" y="110" text-anchor="middle" class="m" font-size="10" letter-spacing="1" fill="#FFFFFF">AI FLAG</text>
  <path d="M48 344 l7 7 l14 -16" fill="none" stroke="#157F3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="350" font-size="14" fill="#12161C">Found, next to the tube</text>

  <!-- panel B -->
  <rect x="420" y="48" width="300" height="270" rx="4" fill="#0E1F3B"/>
  <g fill="none" stroke="#D3D9E0" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="570" y1="62" x2="570" y2="306" stroke="#8D98A6" stroke-width="5" opacity="0.6"/>
    <path d="M560 84 C 500 84, 462 120, 458 200 C 456 250, 476 290, 530 292 C 552 292, 558 270, 558 240 L 558 100"/>
    <path d="M580 84 C 640 84, 678 120, 682 200 C 684 250, 664 290, 610 292 C 588 292, 582 270, 582 240 L 582 100"/>
  </g>
  <g fill="none" stroke="#8D98A6" stroke-width="1" opacity="0.7">
    <path d="M558 110 C 520 104, 488 116, 472 136"/><path d="M558 140 C 518 134, 484 146, 466 168"/><path d="M558 170 C 516 164, 480 176, 462 200"/><path d="M558 200 C 516 194, 480 206, 462 232"/>
    <path d="M582 110 C 620 104, 652 116, 668 136"/><path d="M582 140 C 622 134, 656 146, 674 168"/><path d="M582 170 C 624 164, 660 176, 678 200"/><path d="M582 200 C 624 194, 660 206, 678 232"/>
  </g>
  <path d="M594 98 C 630 104, 648 150, 646 210 C 644 250, 630 276, 606 280" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.8"/>
  <path d="M428 337 l14 14 M442 337 l-14 14" fill="none" stroke="#B42318" stroke-width="2.6" stroke-linecap="round"/>
  <text x="460" y="350" font-size="14" fill="#12161C">Missed, when it matters most</text>
  <text x="40" y="388" font-size="12" fill="#56606C">The dotted line is the edge of the collapsed lung. It is the same in both images; only the tube is different.</text>
</svg>
