<svg width="760" height="420" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cases go to two inspectors who work blind; their findings are scored against an answer key sealed before the run."><style>text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif}.m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;letter-spacing:1.3px}</style><rect width="760" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B3B6F"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D98A6"/></marker>
  </defs>
  <g class="m" font-size="11" letter-spacing="1.3" fill="#1B3B6F">
    <text x="36" y="34">THE CASES</text>
    <text x="318" y="34">TWO INSPECTORS, BLIND</text>
    <text x="548" y="34">SCORED AGAINST THE KEY</text>
  </g>

  <!-- case folders, stacked -->
  <g fill="#FFFFFF" stroke="#12161C" stroke-width="1.5" stroke-linejoin="round">
    <path d="M64 58 h52 l10 12 h104 v118 h-166 z" fill="#F2F4F7"/>
    <path d="M52 70 h52 l10 12 h104 v118 h-166 z" fill="#F8F9FB"/>
    <path d="M40 82 h52 l10 12 h104 v118 h-166 z"/>
  </g>
  <g stroke="#8D98A6" stroke-width="1.5" stroke-linecap="round">
    <line x1="58" y1="118" x2="186" y2="118"/>
    <line x1="58" y1="136" x2="170" y2="136"/>
    <line x1="58" y1="154" x2="182" y2="154"/>
    <line x1="58" y1="172" x2="150" y2="172"/>
    <line x1="58" y1="190" x2="176" y2="190"/>
  </g>
  <!-- a planted fault, hidden from the inspectors -->
  <circle cx="164" cy="154" r="11" fill="none" stroke="#B42318" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="40" y="236" font-size="12" fill="#3B4450">Real failures, clean cases, and</text>
  <text x="40" y="252" font-size="12" fill="#3B4450">cases with faults planted on purpose</text>

  <!-- sealed key -->
  <g stroke="#12161C" stroke-width="1.5" stroke-linejoin="round" fill="#FFFFFF">
    <rect x="48" y="290" width="150" height="92"/>
    <path d="M48 290 L123 340 L198 290" fill="none"/>
  </g>
  <circle cx="123" cy="340" r="15" fill="#1B3B6F"/>
  <rect x="116.5" y="339" width="13" height="10" rx="1.5" fill="#FFFFFF"/>
  <path d="M119 339 v-3.5 a4 4 0 0 1 8 0 v3.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="36" y="404" class="m" font-size="11" letter-spacing="1.3" fill="#1B3B6F">ANSWER KEY, SEALED FIRST</text>

  <!-- arrows to inspectors -->
  <path d="M216 140 C 262 140, 270 118, 318 112" fill="none" stroke="#1B3B6F" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M216 160 C 262 160, 270 262, 318 268" fill="none" stroke="#1B3B6F" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="318" y="54" font-size="12" fill="#1B3B6F" font-style="italic">the same cases to both</text>

  <!-- inspector 1 -->
  <g stroke="#12161C" stroke-width="1.5" fill="none" stroke-linecap="round">
    <circle cx="352" cy="94" r="15"/>
    <path d="M326 142 c0 -20 12 -30 26 -30 s26 10 26 30"/>
    <rect x="392" y="82" width="56" height="70" fill="#FFFFFF"/>
    <line x1="402" y1="100" x2="438" y2="100" stroke="#8D98A6"/>
    <line x1="402" y1="114" x2="432" y2="114" stroke="#8D98A6"/>
    <line x1="402" y1="128" x2="436" y2="128" stroke="#8D98A6"/>
  </g>
  <text x="326" y="172" class="m" font-size="11" letter-spacing="1.3" fill="#12161C">INSPECTOR 1</text>

  <!-- inspector 2 -->
  <g stroke="#12161C" stroke-width="1.5" fill="none" stroke-linecap="round">
    <circle cx="352" cy="250" r="15"/>
    <path d="M326 298 c0 -20 12 -30 26 -30 s26 10 26 30"/>
    <rect x="392" y="238" width="56" height="70" fill="#FFFFFF"/>
    <line x1="402" y1="256" x2="438" y2="256" stroke="#8D98A6"/>
    <line x1="402" y1="270" x2="432" y2="270" stroke="#8D98A6"/>
    <line x1="402" y1="284" x2="436" y2="284" stroke="#8D98A6"/>
  </g>
  <text x="326" y="328" class="m" font-size="11" letter-spacing="1.3" fill="#12161C">INSPECTOR 2</text>

  <!-- filings to score sheet -->
  <path d="M456 117 C 500 117, 510 150, 544 160" fill="none" stroke="#1B3B6F" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M456 273 C 500 273, 510 240, 544 228" fill="none" stroke="#1B3B6F" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- key opened only after both file -->
  <path d="M206 352 C 420 356, 600 362, 643 342" fill="none" stroke="#8D98A6" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ahg)"/>
  <text x="330" y="384" font-size="12" fill="#56606C" font-style="italic">opened only after both have filed</text>

  <!-- score sheet -->
  <rect x="548" y="52" width="190" height="284" fill="#FFFFFF" stroke="#12161C" stroke-width="1.5"/>
  <g class="m" font-size="11" letter-spacing="1.2" fill="#56606C">
    <text x="566" y="78">KEY</text><text x="636" y="78">1</text><text x="692" y="78">2</text>
  </g>
  <line x1="548" y1="90" x2="738" y2="90" stroke="#D3D9E0" stroke-width="1.5"/>
  <!-- rows: key marks: filled red dot = planted fault, open circle = clean -->
  <g>
    <!-- row 1 -->
    <circle cx="578" cy="116" r="6" fill="#B42318"/>
    <path d="M630 116 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M686 116 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- row 2 -->
    <circle cx="578" cy="156" r="6" fill="none" stroke="#12161C" stroke-width="1.5"/>
    <path d="M630 156 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M686 156 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- row 3: one inspector misses -->
    <circle cx="578" cy="196" r="6" fill="#B42318"/>
    <path d="M630 196 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M688 189 l12 12 M700 189 l-12 12" fill="none" stroke="#B42318" stroke-width="2.4" stroke-linecap="round"/>
    <!-- row 4 -->
    <circle cx="578" cy="236" r="6" fill="#B42318"/>
    <path d="M630 236 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M686 236 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- row 5 -->
    <circle cx="578" cy="276" r="6" fill="none" stroke="#12161C" stroke-width="1.5"/>
    <path d="M630 276 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M686 276 l5 5 l10 -11" fill="none" stroke="#157F3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="#E3E8EE" stroke-width="1"><line x1="560" y1="136" x2="726" y2="136"/><line x1="560" y1="176" x2="726" y2="176"/><line x1="560" y1="216" x2="726" y2="216"/><line x1="560" y1="256" x2="726" y2="256"/></g>
  <text x="560" y="308" font-size="11" fill="#56606C">A missed fault counts. So does</text>
  <text x="560" y="321" font-size="11" fill="#56606C">a fault called in a clean case.</text>
</svg>
